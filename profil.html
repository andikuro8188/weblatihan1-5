
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            line-height: 1.6;
        }

        h1 {
            color: #1e3a8a;
            font-size: 2rem;
            text-align: center;
        }

        .jurusan {
            text-align: center;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info {
            font-size: 14px;
            color: #64748b;
        }

        .kartu {
            width: 360px;
            margin: 40px auto;
            padding: 24px;
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
        }

        .tombol {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="kartu">
        <h1>Nama Anda</h1>
        <p class="jurusan">Teknik Informatika</p>
        <p>Saya sedang belajar membuat tampilan web dengan CSS.</p>
        <p class="info">Hobi: membaca dan coding</p>
        <a href="#" class="tombol">Hubungi Saya</a>
    </div>
</body>
</html>
